# CI 高速化の実験（dev/ci-speed ブランチでだけ動く。結論が出たら消す）
# 確認の実験: A（今の CI）と F（node_modules をキャッシュし、当たればインストールを省く）を 5 回ずつ
name: CI experiment

on:
  push:
    branches: [dev/ci-speed]

jobs:
  single:
    name: single (${{ matrix.variant }}, ${{ matrix.rep }})
    strategy:
      fail-fast: false
      matrix:
        variant: [A, F]
        rep: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ matrix.variant == 'A' && 'npm' || '' }}
      - name: restore node_modules
        if: matrix.variant == 'F'
        id: nm
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            !node_modules/.tmp
            !node_modules/.vite
          key: nm-v2-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: install
        run: |
          s=$(date +%s.%N)
          if [ "${{ matrix.variant }}" = "A" ] || [ "${{ steps.nm.outputs.cache-hit }}" != "true" ]; then npm ci; else echo "cache hit"; fi
          echo "TIMING ${{ matrix.variant }} install $(awk "BEGIN{print $(date +%s.%N) - $s}")"
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
